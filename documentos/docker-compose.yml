version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: travel_booker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: travel_booker_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ./documentos/Dockerfile
    container_name: travel_booker_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../environment/.env
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: root
      DB_DATABASE: travel_booker_dev
      DB_PORT: "5432"
      NODE_ENV: local-dev
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
